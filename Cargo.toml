[workspace]
resolver = "2"
members = [
    "crates/ocm-core",
    "crates/ocm-character",
    "crates/ocm-desktop",
    "crates/ocm-desktop-niri",
    "crates/ocm-platform",
    "crates/ocm-platform-wayland",
    "crates/ocm-renderer",
    "apps/ocm-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OpenCuteMate/opencutemate"

[workspace.dependencies]
# Wayland (pinned; exact versions are locked by Cargo.lock)
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
raw-window-handle = "0.6"
calloop = "0.14"

# Graphics (Vulkan-only surface for the PoC; exact version locked by Cargo.lock)
wgpu = { version = "30", default-features = false, features = ["vulkan", "wgsl", "std"] }

# Engine (Phase 2b Bevy backend; render-stack features only, selected in
# ocm-renderer — winit/X11 stay out of the dependency graph)
bevy = { version = "0.20.1", default-features = false }

# Config & CLI
toml = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "2"

# Internal crates
ocm-core = { path = "crates/ocm-core" }
ocm-character = { path = "crates/ocm-character" }
ocm-desktop = { path = "crates/ocm-desktop" }
ocm-desktop-niri = { path = "crates/ocm-desktop-niri" }
ocm-platform = { path = "crates/ocm-platform" }
ocm-platform-wayland = { path = "crates/ocm-platform-wayland" }
ocm-renderer = { path = "crates/ocm-renderer" }

[profile.release]
opt-level = 2

[profile.dev]
# Incremental caches double target-dir size; the regression suites build
# from scratch anyway.
incremental = false

[profile.dev.package."*"]
# Dependency debug info dominates the target directory once the Bevy
# backend is enabled (multi-GB). Line tables keep backtraces symbolized
# and line-attributed through dependencies; workspace crates keep full
# debug info (they inherit profile.dev.debug = true).
debug = "line-tables-only"