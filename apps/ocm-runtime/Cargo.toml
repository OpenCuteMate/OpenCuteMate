[package]
name = "ocm-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ocm-runtime"
path = "src/main.rs"

[features]
default = ["renderer-wgpu", "renderer-bevy"]
renderer-wgpu = ["ocm-renderer/wgpu-backend"]
renderer-bevy = ["ocm-renderer/bevy-backend"]

[dependencies]
ocm-core.workspace = true
ocm-character.workspace = true
ocm-desktop.workspace = true
ocm-desktop-niri.workspace = true
ocm-platform.workspace = true
ocm-platform-wayland.workspace = true
ocm-renderer.workspace = true
calloop.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true